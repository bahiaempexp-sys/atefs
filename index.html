<!DOCTYPE html>
<html lang="ar" dir="rtl" class="viewer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ates S — للاطلاع</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#1F2B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ates S">
<meta name="application-name" content="Ates S">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --paper:#eef1f6; --sheet:#ffffff; --ink:#1c2233; --muted:#5f6880; --line:#d3d9e6;
  --carbon:#2c3d94; --carbon-soft:#e3e8f8; --stamp:#b83227; --stamp-soft:#f8e3e0; --ok:#2f7a4f;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141824; --sheet:#1d2232; --ink:#e6e9f2; --muted:#9aa3bb; --line:#30374c;
    --carbon:#8fa2ff; --carbon-soft:#262e4d; --stamp:#ff7b6e; --stamp-soft:#3d2423; --ok:#6fcf97;
  }
}
:root[data-theme="dark"]{
  --paper:#141824; --sheet:#1d2232; --ink:#e6e9f2; --muted:#9aa3bb; --line:#30374c;
  --carbon:#8fa2ff; --carbon-soft:#262e4d; --stamp:#ff7b6e; --stamp-soft:#3d2423; --ok:#6fcf97;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--stamp);font-weight:600}
.hidden{display:none!important}

/* ---------- Upload screen ---------- */
#upload,.upload-like{min-height:100vh;display:grid;place-items:center;padding:24px}
.drop{width:min(560px,100%);background:var(--sheet);border:2px dashed var(--line);border-radius:14px;padding:40px 32px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--carbon);background:var(--carbon-soft)}
.drop h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:700}
.drop p{margin:0 0 24px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:10px 18px;background:var(--carbon);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--carbon);border:1px solid var(--line)}
.status{margin-top:18px;min-height:22px;color:var(--muted);font-size:14px}
.status.err{color:var(--stamp)}
.formats{margin-top:20px;font-size:13px;color:var(--muted)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--carbon);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
:root[data-theme="dark"] nav.side{background:#222a4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.side{background:#222a4d}}
.brand{font-weight:700;font-size:18px;margin:0 8px 18px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75;word-break:break-all}
.tab{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:#fff;text-align:start;padding:10px 12px;border-radius:8px;opacity:.82}
.tab:hover{background:rgba(255,255,255,.08);opacity:1}
.tab[aria-selected="true"]{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
.tab .count{font-size:12px;background:rgba(255,255,255,.18);border-radius:10px;padding:0 8px}
.side .spacer{flex:1}
.side .tab.small{font-size:13px}
main{padding:24px 28px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h2{margin:0;font-size:24px;line-height:1.2}
.head .sub{color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--carbon-soft);color:var(--carbon);font-weight:600}
.totals{display:flex;flex-wrap:wrap;gap:28px;margin:0 0 18px;padding:14px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.totals div{display:flex;flex-direction:column}
.totals > div > span{font-size:13px;color:var(--muted)}
.totals b{font-size:19px}

/* ---------- Clients: three panes ---------- */
.panes{display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1fr) minmax(320px,1.6fr);gap:16px;align-items:start}
.pane{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pane h3 .back{display:none;border:0;background:none;color:var(--carbon);padding:0;font-weight:600}
.list{list-style:none;margin:0;padding:0;max-height:calc(100vh - 230px);overflow:auto}
.list li button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;padding:12px 16px}
.list li:last-child button{border-bottom:0}
.list li button:hover{background:var(--carbon-soft)}
.list li button[aria-current="true"]{background:var(--carbon-soft);box-shadow:inset 3px 0 0 var(--carbon)}
[dir="rtl"] .list li button[aria-current="true"]{box-shadow:inset -3px 0 0 var(--carbon)}
.list .name{font-weight:600}
.list .meta{font-size:13px;color:var(--muted)}
.list .right{text-align:end}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:14px}

/* ---------- The invoice slip ---------- */
.slip{background:var(--sheet);border:1px solid var(--line);border-radius:0 0 10px 10px;position:relative;padding:22px 20px 18px;margin-top:10px}
.slip::before{content:"";position:absolute;left:-1px;right:-1px;top:-10px;height:10px;
  background:radial-gradient(circle at 7px 0,transparent 5px,var(--sheet) 5.5px) 0 0/14px 10px repeat-x;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.slip-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--carbon);padding-bottom:12px;margin-bottom:12px}
.slip-top .no{font-size:22px;font-weight:700;color:var(--carbon);line-height:1.1}
.slip-top .who{text-align:end;margin-inline-start:auto}
.slip-top .who b{display:block;font-size:17px}
.slip-top .muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:13px;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:end}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.slip-total{display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:2px solid var(--carbon)}
.slip-total div{text-align:end}
.slip-total > div > span{display:block;font-size:13px;color:var(--muted)}
.slip-total b{font-size:20px;color:var(--carbon)}
.note{margin-top:10px;font-size:13px;background:var(--stamp-soft);color:var(--stamp);border-radius:6px;padding:8px 10px}
.ref{font-size:12px;color:var(--muted)}

/* ---------- Day blocks (vente) & stock table ---------- */
.day{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.day > button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;padding:14px 16px;text-align:start}
.day > button:hover{background:var(--carbon-soft)}
.day .date{font-weight:700;font-size:16px}
.day .chev{transition:transform .15s;color:var(--muted);display:inline-block}
.day[open-state="1"] .chev{transform:rotate(90deg)}
[dir="rtl"] .day .chev{transform:scaleX(-1)}
[dir="rtl"] .day[open-state="1"] .chev{transform:rotate(-90deg) scaleX(-1)}
.day .body{border-top:1px solid var(--line);padding:4px 8px 8px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--carbon)}
th.sort[data-dir]::after{content:" ▲";font-size:10px}
th.sort[data-dir="desc"]::after{content:" ▼"}
tr.zero td{color:var(--muted)}
.pill{display:inline-block;font-size:12px;border-radius:10px;padding:0 8px;background:var(--carbon-soft);color:var(--carbon)}
.pill.bad{background:var(--stamp-soft);color:var(--stamp)}
[dir="auto"]{unicode-bidi:plaintext}

@media (max-width:1100px){
  .panes{grid-template-columns:1fr 1fr}
  .panes .pane:nth-child(3){grid-column:1/-1}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;gap:4px}
  .brand,.side .spacer,.side .small{display:none}
  .tab{flex:1;justify-content:center;gap:6px;padding:10px 6px;font-size:14px}
  .tab .count{display:none}
  main{padding:16px 14px 96px}
  .panes{display:block}
  .panes .pane{display:none}
  .panes[data-step="0"] .pane:nth-child(1),
  .panes[data-step="1"] .pane:nth-child(2),
  .panes[data-step="2"] .pane:nth-child(3){display:block}
  .pane h3 .back{display:inline}
  .list{max-height:none}
  .totals{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[dir="rtl"] body{font-size:16px}
.side .tool{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:8px;padding:9px 12px;font-size:13px;text-align:start;width:100%}
.side .tool:hover{background:rgba(255,255,255,.1)}
.side .tool.primary{background:#fff;color:var(--carbon);border-color:#fff;font-weight:600}
:root[data-theme="dark"] .side .tool.primary{color:#222a4d}
.side .tools-bottom{display:flex;flex-direction:column;gap:6px}
.side .stamp{font-size:12px;opacity:.75;margin:0 8px}
.lang-up{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:6}
.toast{position:fixed;inset-inline-start:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:min(520px,92vw)}
[dir="rtl"] .toast{transform:translateX(50%)}
.mobile-tools{display:none}
@media (max-width:760px){
  .side .tools-bottom,.side .stamp{display:none}
  .mobile-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

span[dir="ltr"],b[dir="ltr"]{unicode-bidi:isolate;direction:ltr}
.slip-total b,.totals b,.list .right{white-space:nowrap}

.side-season{display:flex;flex-direction:column;gap:4px;margin:0 4px 14px;font-size:12px;color:rgba(255,255,255,.8)}
.side-season select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;font-size:14px}
.side-season select option{color:#1c2233;background:#fff}
.mobile-tools .season-box select{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px}
@media (max-width:760px){ .side-season{display:none!important} }

/* Consultation file: its own colour so it is never confused with the admin page */
:root.viewer{--carbon:#1d6b5c;--carbon-soft:#e1f1ec}
:root.viewer nav.side{background:#1d6b5c}
@media (prefers-color-scheme: dark){
  :root.viewer:not([data-theme="light"]){--carbon:#6fd3bb;--carbon-soft:#1f3a35}
  :root.viewer:not([data-theme="light"]) nav.side{background:#1d3a34}
}
:root.viewer[data-theme="dark"]{--carbon:#6fd3bb;--carbon-soft:#1f3a35}
:root.viewer[data-theme="dark"] nav.side{background:#1d3a34}

.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

/* ---------- Shop name, coffre, PDF ---------- */
.brand small{opacity:.75}
.shop-input{width:100%;border-radius:8px;padding:8px 10px;font-size:14px}
.side-shop{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);margin:-8px 0 14px}
.side-shop::placeholder{color:rgba(255,255,255,.65)}
.shop-up{display:block;width:100%;margin:0 0 14px;text-align:center}
.money-hero{background:var(--carbon);color:#fff;border-radius:12px;padding:18px 22px;margin:0 0 16px;display:flex;flex-direction:column;gap:2px}
.money-hero > span{font-size:14px;opacity:.85}
.money-hero b{font-size:30px;line-height:1.2}
.money-hero small{font-size:12px;opacity:.75}
:root[data-theme="dark"] .money-hero{color:#10131c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .money-hero{color:#10131c}}
.slip-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.slip-actions .pdf-btn{margin-inline-start:auto}
.btn:disabled{opacity:.6;cursor:progress}
.m-brand,.m-row,.m-shop{display:none}

/* ---------- Phone ---------- */
@media (max-width:760px){
  .mobile-tools{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin:0 0 16px}
  .m-brand{display:flex;flex-direction:column;padding:2px 2px 0}
  .m-brand b{font-size:19px;line-height:1.25;color:var(--carbon)}
  .m-brand small{font-size:12px;color:var(--muted)}
  .m-brand small:empty{display:none}
  .m-shop{display:block;background:var(--sheet);border:1px solid var(--line);color:var(--ink)}
  .m-row{display:flex;gap:8px;align-items:stretch}
  .m-row .season-box{flex:1;display:flex}
  .m-row .season-box.hidden{display:none}
  .m-row .season-box select{width:100%}
  .m-row .btn{flex:0 0 auto}
  .mobile-tools > .btn{justify-content:center}
  body[data-view="coffre"] .season-box{visibility:hidden}
  .head{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:14px}
  .head h2{font-size:22px}
  .tools{width:100%}
  .tools .input[type="search"]{flex:1 1 100%;width:100%}
  .tools label.ref{flex:1 1 40%;display:flex;align-items:center;gap:6px}
  .tools label.ref .input{flex:1;min-width:0;width:100%}
  .seg{width:100%;display:flex}
  .seg button{flex:1;padding:9px 6px}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:12px 14px}
  .totals b{font-size:17px}
  #main[data-step="1"] .c-overview,#main[data-step="2"] .c-overview{display:none}
  .slip{padding:20px 14px 14px}
  .slip-top .no{font-size:19px}
  .money-hero b{font-size:26px}
  .tab{font-size:13px;padding:10px 4px}
  /* tables become cards */
  table.resp thead{display:none}
  table.resp,table.resp tbody{display:block;width:100%}
  table.resp tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:12px 6px;border-bottom:1px solid var(--line)}
  table.resp tbody tr:last-child{border-bottom:0}
  table.resp td{display:block;border:0;padding:0 2px;text-align:start!important;min-width:0}
  table.resp td.t{grid-column:1/-1}
  table.resp td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:400}
  table.resp td.empty{grid-column:1/-1;text-align:center!important}
  .card.scroll,.body.scroll,.slip .scroll{overflow-x:visible}
}

@media (max-width:760px){ table.money-days tr.zero td:not(.t){display:none} table.money-days tr.zero{padding:8px 6px} }

/* =================== Professional refresh =================== */
:root{--paper:#f3f5f9;--line:#e2e7ef;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);--radius:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#11141d;--line:#2a3142;--shadow:none}}
:root[data-theme="dark"]{--paper:#11141d;--line:#2a3142;--shadow:none}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.ic{width:20px;height:20px;flex:0 0 auto}
#app{grid-template-columns:248px 1fr}
nav.side{padding:18px 12px;gap:2px}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 16px}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt > span{font-size:16px;line-height:1.25}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);flex:0 0 auto}
.brand-mark .ic{width:22px;height:22px}
.brand-mark.sm{width:34px;height:34px;background:var(--carbon);color:#fff}
.tab{gap:10px;justify-content:flex-start;padding:10px 12px;font-size:14.5px}
.tab .tab-l{flex:1}
.side .tool{display:flex;align-items:center;gap:8px}
.side .tool .ic{width:17px;height:17px}
.btn{gap:8px}
.btn .ic{width:18px;height:18px}
main{padding:26px 30px;max-width:1500px}
.head h2{font-size:25px;letter-spacing:-.01em}
.card,.pane,.totals,.day,.slip{box-shadow:var(--shadow)}
.card,.pane,.totals,.day{border-radius:var(--radius)}
.totals{gap:0;padding:0;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.totals > div{padding:14px 18px;border-inline-end:1px solid var(--line)}
.totals > div:last-child{border-inline-end:0}
.totals b{font-size:18px;margin-top:2px}
.input,.seg,select{border-radius:10px}
.pane h3{background:color-mix(in srgb,var(--paper) 55%,var(--sheet))}
.appbar,.m-season,.m-only{display:none}

/* menu cards */
.menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0 0 18px}
.menu-card{--acc:var(--carbon);display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:start;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s;color:var(--ink);min-width:0}
.menu-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));box-shadow:0 6px 18px rgba(16,24,40,.08)}
.menu-card.c1{--acc:#3b5bdb}.menu-card.c2{--acc:#e8590c}.menu-card.c3{--acc:#7048e8}.menu-card.c4{--acc:#2b8a3e}
.mc-top{display:flex;align-items:center;gap:10px}
.mc-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}
.mc-title{font-weight:600;font-size:15px;flex:1}
.mc-go{color:var(--muted)}.mc-go .ic{width:18px;height:18px}
[dir="rtl"] .mc-go .ic,[dir="rtl"] .tab .ic-chev{transform:scaleX(-1)}
.mc-big{font-size:21px;font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-sub{font-size:13px;color:var(--muted)}
.home-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--carbon);font-weight:600;font-size:13px;padding:0}
.mini{list-style:none;margin:0;padding:0}
.mini li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 16px;text-align:start}
.mini li:last-child button{border-bottom:0}
.mini li button:hover{background:var(--carbon-soft)}
.mini li button > span{display:flex;flex-direction:column;min-width:0}

function t(key, ...a){ const v = T[lang][key]; if (typeof v === "function") return v(...a); if (Array.isArray(v)) return v; return String(v ?? key).replace(/\{(\d)\}/g, (_, i) => a[i]); }

const fmtN = new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 2});
const money = v => `<span class="num" dir="ltr">${fmtN.format(Math.round(num(v) * 100) / 100)}</span> ${t("currency")}`;

const qty = v => `<span dir="ltr">${fmtN.format(num(v))}</span>`;
function dateKey(d){
  if (d instanceof Date) return d.toISOString().slice(0,10);
  const s = str(d); let m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : s;
}
function prettyDate(k, long){
  const m = String(k).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return esc(k);
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return (long ? t("days")[d.getDay()] + " " : "") + d.getDate() + " " + t("months")[d.getMonth()] + " " + m[1];
}

/* ---------------- Model ---------------- */
const M = {};
const state = { cFrom: "", cTo: "", season: "", view: "home", client: null, invoice: null, step: 0, venteMode: null, from: "", to: "", q: "", stockQ: "", stockFilter: "all", sort: { key: "ref", dir: "asc" }, openDays: new Set() };

function buildModel(raw){
  const lines = raw.sells.map(r => {
    const q = num(pick(r, "Quantity")), pu = num(pick(r, "Price_U"));
    let total = q * pu;
    if (!total) total = num(pick(r, "Price_Total")) || num(pick(r, "Sell_Time"));
    return { id: num(r.ID), product: str(pick(r, "Prudct_name", "Product_Name")), ref: str(pick(r, "ProdcSymb")),
      qty: q, pu, total, client: str(pick(r, "Customr_Name")), date: dateKey(pick(r, "Sell_Date")),
      nf: str(pick(r, "NFacture")) || "—", page: str(pick(r, "pageN", "PageN")), vday: num(pick(r, "v_day")), season: str(pick(r, "Season", "SEASON")) };
  }).sort((a,b) => a.id - b.id);

  const custRows = raw.customers.map(r => ({ id: num(r.ID), name: str(pick(r, "Customr_Name")), adrs: str(pick(r, "Customr_Adrs")),
    tel: str(pick(r, "Customr_Tel")), credit: num(pick(r, "TotalCredit")), rest: num(pick(r, "RestPayment")) }));
  const known = new Set(custRows.map(c => c.name));
  lines.forEach(l => l.libre = l.vday !== 0 || !l.client || l.client === "-" || !known.has(l.client));

  // Invoice headers (FactureSell). Rows dated "حساب قديم" are the old balance brought in, not invoices.
  const isOld = v => /حساب قديم|ancien/i.test(str(v));
  const oldAccount = {}; // client§season -> amount
  const headers = [];
  raw.factures.forEach(r => {
    const h = { id: num(r.ID), client: str(pick(r, "CostumerName", "Customr_Name")), sold: num(pick(r, "Sold")), rawDate: pick(r, "SellDate"),
      date: dateKey(pick(r, "SellDate")), time: str(pick(r, "SellTime")), season: str(pick(r, "Season")),
      versement: num(pick(r, "Versemnt")), page: str(pick(r, "PageN")), type: str(pick(r, "Type")) };
    if (isOld(h.rawDate)) { const k = h.client + "§" + h.season; oldAccount[k] = (oldAccount[k] || 0) + h.sold; }
    else headers.push(h);
  });
  headers.sort((a,b) => a.id - b.id);

  // Lines are linked to their header by invoice page number (pageN = PageN) when the file stores it;
  // older files only have a per-client counter (NFacture), matched by order.
  const clientLines = lines.filter(l => !l.libre);
  const pageKeys = new Set(clientLines.map(l => l.client + "§" + l.season + "§" + l.page));
  const byPage = headers.filter(h => pageKeys.has(h.client + "§" + h.season + "§" + h.page)).length;
  const usePage = headers.length > 0 && byPage >= headers.length * 0.6;

  const invoices = {};
  for (const l of clientLines){
    const num_ = usePage ? l.page : l.nf;
    const key = l.client + "§" + l.season + "§" + num_;
    // shown number: the client's own invoice counter (1, 2, 3… each season), like the software
    const inv = (invoices[key] ||= { key, client: l.client, season: l.season, nf: (usePage ? l.nf : num_) || num_, page: l.page, lines: [], date: l.date, total: 0, qty: 0 });
    inv.lines.push(l); inv.total += l.total; inv.qty += l.qty; if (l.date < inv.date) inv.date = l.date;
  }
  if (usePage){
    const hmap = {}; headers.forEach(h => hmap[h.client + "§" + h.season + "§" + h.page] = h);
    for (const inv of Object.values(invoices)) inv.header = hmap[inv.key] || null;
  } else {
    const headersByClient = {};
    headers.forEach(h => { (headersByClient[h.client] ||= []).push(h); (headersByClient[h.client + "§" + h.season] ||= []).push(h); });
    for (const inv of Object.values(invoices)){
      const n = parseInt(inv.nf, 10), hsS = headersByClient[inv.client + "§" + inv.season] || [], hsA = headersByClient[inv.client] || [];
      inv.header = n >= 1 ? (hsS[n-1] || hsA[n-1] || null) : null;
    }
  }
  for (const inv of Object.values(invoices)) if (inv.header && inv.header.date && /^\d{4}-/.test(inv.header.date)) inv.date = inv.header.date;
  const byClient = {};
  for (const inv of Object.values(invoices)) (byClient[inv.client] ||= []).push(inv);
  for (const k in byClient) byClient[k].sort((a,b) => a.date.localeCompare(b.date) || (parseInt(a.page)||0) - (parseInt(b.page)||0) || (parseInt(a.nf)||0) - (parseInt(b.nf)||0));
  // Shown number: each client's invoices count 1, 2, 3… within every season
  if (usePage) for (const k in byClient){ const seen = {}; byClient[k].forEach(inv => { seen[inv.season] = (seen[inv.season] || 0) + 1; inv.nf = String(seen[inv.season]); }); }

  // Payments (TabelVersemnt). Rows typed "عند الشراء" are the payment made with an invoice.
  const payments = (raw.payments || []).map(r => ({ id: num(r.ID), client: str(pick(r, "CustomrName", "Customr_Name")),
      amount: num(pick(r, "Versement")), invTotal: num(pick(r, "Total")), date: dateKey(pick(r, "DateS")),
      type: str(pick(r, "TypeVersement")), cash: str(pick(r, "typedecash")), season: str(pick(r, "Season")) }))
    .sort((a,b) => a.id - b.id);
  const hasPayTable = payments.length > 0;
  const atPurchase = p => /عند الشراء|achat/i.test(p.type);
  const payByClient = {};
  payments.forEach(p => (payByClient[p.client] ||= []).push(p));
  for (const name in byClient){
    const groups = {};
    byClient[name].forEach(inv => (groups[inv.season] ||= []).push(inv));
    for (const season in groups){
      const rows = (payByClient[name] || []).filter(p => atPurchase(p) && p.season === season);
      const taken = new Set();
      groups[season].forEach(inv => {
        const tot = inv.header ? inv.header.sold : inv.total;
        const i = rows.findIndex((p, j) => !taken.has(j) && p.date === inv.date && Math.abs(p.invTotal - tot) <= 1);
        if (i >= 0) taken.add(i);
        inv._pay = i;
      });
      let k = 0;
      groups[season].forEach(inv => {
        let i = inv._pay;
        if (i < 0){ while (k < rows.length && taken.has(k)) k++; if (!usePage && k < rows.length){ i = k; taken.add(k); } }
        inv.paidAtPurchase = i >= 0 ? rows[i].amount : (inv.header ? inv.header.versement : 0);
        delete inv._pay;
      });
    }
  }

  const clients = custRows.slice();
  for (const name of Object.keys(byClient)) if (!known.has(name)) clients.push({ id: 0, name, adrs: "", tel: "", credit: 0, rest: 0 });
  clients.forEach(c => { c.allInvoices = byClient[c.name] || []; c.allPayments = payByClient[c.name] || []; });

  const stock = raw.stock.map(r => {
    const rest = num(pick(r, "product_Quantity")), init = num(pick(r, "product_QuantitySS")), pu = num(pick(r, "Unit_Price"));
    return { id: num(r.ID), ref: str(pick(r, "Product_Symb")), product: str(pick(r, "Product_Name")), supplier: str(pick(r, "Fournisseur_Name")),
      pu, init, rest, sold: init ? init - rest : 0, carton: num(pick(r, "TypeCarton")), value: rest * pu, season: str(pick(r, "SEASON", "Season")) };
  });

  // Seasons run in sequence: صيف Y (summer) then شتاء Y (winter); the newest is listed first.
  const seasonRank = s => { const y = +((s.match(/\d{4}/) || [0])[0]); const w = /شتاء|hiver|winter/i.test(s) ? 1 : 0; return y * 2 + w; };
  const seasons = [...new Set([...lines.map(l => l.season), ...stock.map(s => s.season), ...raw.factures.map(f => str(pick(f, "Season")))].filter(Boolean))]
    .sort((a,b) => seasonRank(b) - seasonRank(a) || a.localeCompare(b, "ar"));
  const seasonsAsc = seasons.slice().reverse();
  // Coffre / caisse: money per day
  const days = {};
  const day = d => (days[d] ||= { date: d, caisse: 0, libre: 0, pays: 0, expS: 0, expO: 0, inn: 0, out: 0, outs: [], known: false });
  (raw.caisse || []).forEach(r => { const d = dateKey(pick(r, "Caisse_Date")); if (!d) return; const x = day(d); x.caisse += num(pick(r, "Total")); x.known = true; });
  payments.forEach(p => { if (!p.date) return; const x = day(p.date); x.pays += p.amount; if (p.amount) x.known = true; });
  lines.forEach(l => { if (!l.libre || !l.date || !l.total) return; const x = day(l.date); x.libre += l.total; x.known = true; });
  // Expenses: EmplyerHystory = shop, ExpensesCompanyTAB = owner
  const expenses = [];
  (raw.expShop || []).forEach(r => expenses.push({ kind: "S", id: num(r.ID), date: dateKey(pick(r, "Edate")), amount: num(pick(r, "Sum")), name: str(pick(r, "nameE")), obs: str(pick(r, "obsv")) }));
  (raw.expOwner || []).forEach(r => expenses.push({ kind: "O", id: num(r.ID), date: dateKey(pick(r, "datecomp")), amount: num(pick(r, "Sum")), name: str(pick(r, "namecomp")), obs: [str(pick(r, "type")), str(pick(r, "OBsv"))].filter(Boolean).join(" · ") }));
  expenses.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  expenses.forEach(e => { if (!e.date) return; const x = day(e.date); if (e.kind === "S") x.expS += e.amount; else x.expO += e.amount; x.known = true; });
  // Money entered into the coffer = vente libre + client payments − expenses
  Object.values(days).forEach(x => { x.inn = x.libre + x.pays - x.expS - x.expO; });
  (raw.cofforOut || []).forEach(r => { const d = dateKey(pick(r, "DateSortie")); if (!d) return; const x = day(d); const s = num(pick(r, "Somme")); x.out += s; x.outs.push({ amount: s, obs: str(pick(r, "obs")) }); x.known = true; });
  const moneyDays = Object.values(days).filter(d => d.known).sort((a,b) => b.date.localeCompare(a.date));
  const cofforRows = (raw.coffor || []).slice().sort((a,b) => num(a.ID) - num(b.ID));
  const softBalance = cofforRows.length ? num(pick(cofforRows[cofforRows.length - 1], "CofforTotal")) : null;
  const moves = (raw.cofforHist || []).map(r => ({ id: num(r.ID), date: dateKey(pick(r, "DateC")), amount: num(pick(r, "Somme")),
      type: str(pick(r, "TypeDEopiratio")), obs: str(pick(r, "Obs")) })).sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);

  Object.assign(M, { oldAccount, seasonsAsc, expenses, moneyDays, softBalance, moves, hasPayTable, lines, clients, invoices, stock, seasons, libreAll: lines.filter(l => l.libre).length });
  Object.assign(state, { season: "", venteMode: M.libreAll ? "libre" : "all", client: null, invoice: null, step: 0, openDays: new Set() });
  applySeason();
  renderSeasonPickers();
}

/* ---------------- Season filter ---------------- */
const inSeason = x => !state.season || x.season === state.season;
function applySeason(){
  M.clients.forEach(c => {
    c.invoices = c.allInvoices.filter(inSeason);
    c.bought = c.invoices.reduce((s,i) => s + i.total, 0);
    c.last = c.invoices.reduce((m,i) => i.date > m ? i.date : m, "");
    c.payments = c.allPayments.filter(inSeason);
    c.paid = M.hasPayTable ? c.payments.reduce((s,p) => s + p.amount, 0) : c.invoices.reduce((s,i) => s + (i.paidAtPurchase || 0), 0);
    // Previous credit: the balance left from the seasons before (they run in sequence),
    // plus any "حساب قديم" opening balance. Reste = previous credit + purchases − payments.
    let carry = 0, prevOfSeason = 0;
    for (const s of M.seasonsAsc){
      const old = M.oldAccount[c.name + "§" + s] || 0;
      const b = c.allInvoices.reduce((t,i) => t + (i.season === s ? i.total : 0), 0);
      const p = M.hasPayTable ? c.allPayments.reduce((t,x) => t + (x.season === s ? x.amount : 0), 0)
                              : c.allInvoices.reduce((t,i) => t + (i.season === s ? (i.paidAtPurchase || 0) : 0), 0);
      if (s === state.season) prevOfSeason = carry + old;
      carry = carry + old + b - p;
    }
    if (state.season){ c.prev = prevOfSeason; c.rest = c.prev + c.bought - c.paid; }
    else { c.prev = M.seasonsAsc.reduce((t,s) => t + (M.oldAccount[c.name + "§" + s] || 0), 0); c.rest = carry; }
    c.totalDue = c.prev + c.bought;
  });
  M.clients.sort((a,b) => b.bought - a.bought || a.name.localeCompare(b.name, "ar"));
  M.sLines = M.lines.filter(inSeason);
  M.sStock = mergeStock(M.stock.filter(inSeason));
  M.libreCount = M.sLines.filter(l => l.libre).length;
  M.invCount = Object.values(M.invoices).filter(inSeason).length;
  $("#c-clients").textContent = M.clients.length;
  $("#c-vente").textContent = M.libreCount || M.sLines.length;
  $("#c-stock").textContent = M.sStock.length;
  $("#c-coffre").textContent = M.moneyDays.length;
}
// Each stock row is its own reference (e.g. "1102" and "1102." stay separate).
function mergeStock(list){
  return list.map(s => Object.assign({}, s, { variants: [s.ref], puVaries: false, cartonTxt: s.carton ? fmtN.format(s.carton) : "" }));
}
function renderSeasonPickers(){
  const opts = `<option value="">${esc(t("allSeasons"))}</option>` + M.seasons.map(s => `<option value="${esc(s)}"${s === state.season ? " selected" : ""}>${esc(s)}</option>`).join("");
  document.querySelectorAll("[data-season]").forEach(sel => {
    sel.innerHTML = opts; sel.value = state.season;
    sel.closest(".season-box").classList.toggle("hidden", M.seasons.length === 0);
  });
  document.querySelectorAll("[data-t-season]").forEach(el => el.textContent = t("season"));
}
document.addEventListener("change", e => {
  const sel = e.target.closest("[data-season]"); if (!sel) return;
  state.season = sel.value;
  const c = M.clients.find(x => x.name === state.client);
  state.invoice = null; state.step = c ? 1 : 0; state.openDays = new Set();
  applySeason(); renderSeasonPickers(); show(state.view, true);
});

/* ---------------- Navigation ---------------- */
function show(view, keepScroll){
  state.view = view;
  if (view !== "clients" && view !== "home") state.step = state.client ? Math.min(state.step, 1) : 0;
  document.querySelectorAll(".tab[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  document.body.dataset.view = view;
  ({ home: renderHome, clients: renderClients, vente: renderVente, stock: renderStock, coffre: renderCoffre })[view]();
  if (!keepScroll) window.scrollTo(0, 0);
}

/* ---------------- Clients ---------------- */
function renderClients(){
  const q = state.q.toLowerCase();
  const list = M.clients.filter(c => !q || c.name.toLowerCase().includes(q) || c.tel.includes(q));
  const totalAll = M.clients.reduce((s,c) => s + c.bought, 0);
  const paidAll = M.clients.reduce((s,c) => s + c.paid, 0), restAll = M.clients.reduce((s,c) => s + c.rest, 0);
  const prevAll = M.clients.reduce((s,c) => s + c.prev, 0);
  const c = M.clients.find(x => x.name === state.client);
  const inv = c && c.invoices.find(i => i.key === state.invoice);
  const back = lang === "ar" ? "›" : "‹";

  $("#main").dataset.step = state.step;
  $("#main").innerHTML = `
    <div class="head c-overview">
      <div><h2>${t("clients")}</h2><div class="sub">${t("clientsSub", M.clients.length, M.invCount, moneyTxt(totalAll))}</div></div>
      <div class="tools"><input class="input" id="q" type="search" placeholder="${esc(t("searchClient"))}" value="${esc(state.q)}" dir="auto"></div>
    </div>
    <div class="totals c-overview">
      <div><span>${t("prevCredit")}</span><b>${money(prevAll)}</b></div>
      <div><span>${t("purchases")}</span><b>${money(totalAll)}</b></div>
      <div><span>${t("paid")}</span><b style="color:var(--ok)">${money(paidAll)}</b></div>
      <div><span>${t("restToPay")}</span><b class="${restAll > 0 ? "neg" : ""}">${money(restAll)}</b></div>
    </div>
    <div class="panes" data-step="${state.step}">
      <section class="pane">
        <h3>${t("clients")} <span class="ref">${list.length}</span></h3>
        <ul class="list">${list.map(x => `
          <li><button data-client="${esc(x.name)}" aria-current="${x.name === state.client}">
            <span><span class="name" dir="auto">${esc(x.name)}</span><br><span class="meta">${t("invoicesN", x.invoices.length)}${x.last ? " · " + t("lastOn", prettyDate(x.last)) : ""}</span></span>
            <span class="right num">${money(x.bought)}<br>${x.bought || x.prev ? (x.rest > 0.5 ? `<span class="meta neg" style="font-weight:500">${t("restShort", moneyTxt(x.rest))}</span>` : `<span class="pill ok">${t("paidFull")}</span>`) : ""}</span>
          </button></li>`).join("") || `<li class="empty">${esc(t("noClientMatch", state.q))}</li>`}
        </ul>
      </section>
      <section class="pane">
        <h3><button class="back" data-back="0">${back} ${t("clients")}</button><span dir="auto">${c ? esc(c.name) : t("invoices")}</span></h3>
        ${c ? clientInvoices(c) : `<div class="empty">${t("pickClient")}</div>`}
      </section>
      <section class="pane" style="background:transparent;border:0;overflow:visible">
        ${inv ? invoiceSlip(c, inv, back) : `<div class="card"><div class="empty">${t("pickInvoice")}</div></div>`}
      </section>
    </div>`;

  const qi = $("#q");
  qi.addEventListener("input", () => { state.q = qi.value; const pos = qi.selectionStart; renderClients(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll("[data-client]").forEach(b => b.addEventListener("click", () => { state.client = b.dataset.client; state.invoice = null; state.step = 1; renderClients(); if (matchMedia("(max-width:760px)").matches) window.scrollTo(0,0); }));
  document.querySelectorAll("[data-inv]").forEach(b => b.addEventListener("click", () => { state.invoice = b.dataset.inv; state.step = 2; renderClients(); window.scrollTo(0,0); }));
  document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => { state.step = +b.dataset.back; renderClients(); window.scrollTo(0,0); }));
}

function clientInvoices(c){
  const info = [c.tel && c.tel !== "-" ? t("tel") + " " + esc(c.tel) : "", c.adrs && c.adrs !== "-" ? `<span dir="auto">${esc(c.adrs)}</span>` : ""].filter(Boolean).join(" · ");
  return `
    <div style="padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px">
      ${info ? `<div class="ref" style="margin-bottom:6px">${info}</div>` : ""}
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div><span class="ref">${t("prevCredit")}</span><br><b>${money(c.prev)}</b></div>
        <div><span class="ref">${t("purchases")}</span><br><b>${money(c.bought)}</b></div>
        <div><span class="ref">${t("totalDue")}</span><br><b>${money(c.totalDue)}</b></div>
        <div><span class="ref">${t("paid")}</span><br><b style="color:var(--ok)">${money(c.paid)}</b></div>
        <div><span class="ref">${t("restToPay")}</span><br><b class="${c.rest > 0.5 ? "neg" : ""}">${money(c.rest)}</b></div>
      </div>
    </div>
    <ul class="list">${c.invoices.map(i => `
      <li><button data-inv="${esc(i.key)}" aria-current="${i.key === state.invoice}">
        <span><span class="name">${t("invoiceNo", esc(i.nf))}</span><br><span class="meta">${!state.season && i.season ? `<span dir="auto">${esc(i.season)}</span> · ` : ""}${prettyDate(i.date)}${i.header && i.header.time ? t("at") + esc(i.header.time) : ""} · ${t("articlesN", i.lines.length)}</span></span>
        <span class="right num">${money(i.total)}</span>
      </button></li>`).join("") || `<li class="empty">${t("noInvoice")}</li>`}
    </ul>
    ${paymentsBlock(c)}`;
}

function paymentsBlock(c){

function renderVente(){

  if (state.to) rows = rows.filter(l => l.date <= state.to);
  const byDay = {}; rows.forEach(l => (byDay[l.date] ||= []).push(l));

  const tot = rows.reduce((s,l) => s + l.total, 0), pcs = rows.reduce((s,l) => s + l.qty, 0);
  if (!state.openDays.size && daysK[0]) state.openDays.add(daysK[0]);

  $("#main").innerHTML = `

      <div><h2>${mode === "libre" ? t("vente") : t("allSales")}</h2><div class="sub">${t("byDay")}</div></div>

      <div><span>${t("piecesSold")}</span><b>${qty(pcs)}</b></div>

      return `<div class="day" open-state="${open ? 1 : 0}">
        <button data-day="${k}" aria-expanded="${open}">
          <span><span class="date">${prettyDate(k, true)}</span><br><span class="ref">${t("dayMeta", ls.length, fmtN.format(p))}</span></span>

        </button>
        ${open ? `<div class="body scroll"><table class="resp">
          <thead><tr><th>${t("article")}</th>${mode === "all" ? `<th>${t("client")}</th>` : ""}<th class="r">${t("qty")}</th><th class="r">${t("unitPrice")}</th><th class="r">${t("amount")}</th></tr></thead>
          <tbody>${ls.map(l => `<tr>
            <td class="t"><span dir="auto">${esc(l.product)}</span><br><span class="ref" dir="ltr">${esc(l.ref)}</span></td>
            ${mode === "all" ? `<td data-l="${t("client")}"><span dir="auto">${esc(l.client || "—")}</span>${l.libre ? "" : `<br><span class="ref">${t("invoiceShort", esc(l.nf))}</span>`}</td>` : ""}

          </tbody></table></div>` : ""}
      </div>`;

  const cl = $("#clear"); cl && cl.addEventListener("click", () => { state.from = state.to = ""; state.openDays = new Set(); renderVente(); });
}

async function downloadInvoicePdf(){
  const c = M.clients.find(x => x.name === state.client);
  const inv = c && c.invoices.find(i => i.key === state.invoice);
  if (!inv) return;
  const btn = $("[data-pdf]"); if (btn) btn.disabled = true;
  toast(t("pdfMaking"));
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;top:0;left:-12000px;z-index:-1";
  holder.innerHTML = invoicePrintHtml(c, inv);
  document.body.appendChild(holder);
  try{
    for (const s of PDF_LIBS) await loadScript(s);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas(holder.firstElementChild, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "pt", format: "a4", orientation: "portrait" });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const pageCanvasH = Math.floor(canvas.width * ph / pw);
    for (let y = 0, page = 0; y < canvas.height; y += pageCanvasH, page++){
      const slice = document.createElement("canvas");
      slice.width = canvas.width; slice.height = Math.min(pageCanvasH, canvas.height - y);
      slice.getContext("2d").drawImage(canvas, 0, y, canvas.width, slice.height, 0, 0, canvas.width, slice.height);
      if (page) pdf.addPage();
      pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pw, slice.height * pw / canvas.width);
    }
    const safe = (c.name + "-" + inv.nf).replace(/[\\/:*?"<>|\s]+/g, "-");
    const filename = (lang === "ar" ? "فاتورة-" : "facture-") + safe + ".pdf";
    await saveBlob(pdf.output("blob"), filename);
    toast(t("pdfDone", filename));
  }catch(e){
    console.error(e);
    if (!(e && e.code === "declined")) toast(t("pdfFail", e && e.message === "network" ? t("netNeeded") : ((e && (e.message || e.code)) || e)));
  }finally{
    holder.remove(); if (btn) btn.disabled = false;
  }
}

/* ---------------- Stock ---------------- */
const STOCK_COLS = [["ref","cRef"],["product","cProduct"],["supplier","cSupplier"],["pu","cPu",1],["init","cInit",1],["sold","cSold",1],["rest","cRest",1],["carton","cCarton",1],["value","cValue",1]];
function renderStock(){
  const q = state.stockQ.toLowerCase();
  let rows = M.sStock.filter(s => !q || s.variants.some(v => v.toLowerCase().includes(q)) || s.product.toLowerCase().includes(q) || s.supplier.toLowerCase().includes(q));
  if (state.stockFilter === "in") rows = rows.filter(s => s.rest > 0);
  if (state.stockFilter === "out") rows = rows.filter(s => s.rest === 0);
  if (state.stockFilter === "neg") rows = rows.filter(s => s.rest < 0);
  const { key, dir } = state.sort;
  rows.sort((a,b) => { const x = a[key], y = b[key]; const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "fr", {numeric:true}); return dir === "asc" ? r : -r; });
  const restTotal = M.sStock.reduce((s,x) => s + Math.max(0, x.rest), 0);
  const valTotal = M.sStock.reduce((s,x) => s + Math.max(0, x.value), 0);
  const negs = M.sStock.filter(x => x.rest < 0).length, outs = M.sStock.filter(x => x.rest === 0).length;

  $("#main").innerHTML = `
    <div class="head">
      <div><h2>${t("stockTitle")}</h2><div class="sub">${t("refsN", M.sStock.length)}</div></div>
      <div class="tools">
        <input class="input" id="sq" type="search" placeholder="${esc(t("searchStock"))}" value="${esc(state.stockQ)}" dir="auto">
        <div class="seg" role="group">
          <button data-f="all" aria-pressed="${state.stockFilter==="all"}">${t("fAll")}</button>
          <button data-f="in" aria-pressed="${state.stockFilter==="in"}">${t("fIn")}</button>
          <button data-f="out" aria-pressed="${state.stockFilter==="out"}">${t("fOut")}</button>
          ${negs ? `<button data-f="neg" aria-pressed="${state.stockFilter==="neg"}">${t("fNeg")}</button>` : ""}
        </div>
      </div>
    </div>
    <div class="totals">
      <div><span>${t("piecesInStock")}</span><b>${qty(restTotal)}</b></div>
      <div><span>${t("stockValue")}</span><b>${money(valTotal)}</b></div>
      <div><span>${t("refsOut")}</span><b>${qty(outs)}</b></div>
      ${negs ? `<div><span>${t("negQty")}</span><b class="neg">${qty(negs)}</b></div>` : ""}
    </div>
    <div class="card scroll"><table class="resp">
      <thead><tr>${STOCK_COLS.map(([k,l,r]) => `<th class="sort${r?" r":""}" data-sort="${k}" ${key===k?`data-dir="${dir}"`:""} tabindex="0">${t(l)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(s => `<tr class="${s.rest === 0 ? "zero" : ""}">
        <td class="t"><b dir="ltr">${esc(s.ref)}</b>${s.variants.length > 1 ? `<br><span class="ref">${t("variantsN", s.variants.length)} : <span dir="ltr">${s.variants.map(esc).join("  ·  ")}</span></span>` : ""}</td>
        <td class="t"><span dir="auto">${esc(s.product)}</span></td>
        <td data-l="${t("cSupplier")}"><span dir="auto">${esc(s.supplier)}</span></td>
        <td class="r num" data-l="${t("cPu")}">${s.puVaries ? "≥ " : ""}${money(s.pu)}</td>
        <td class="r num" data-l="${t("cInit")}">${qty(s.init)}</td>
        <td class="r num" data-l="${t("cSold")}">${qty(s.sold)}</td>
        <td class="r num" data-l="${t("cRest")}">${s.rest < 0 ? `<span class="neg">${qty(s.rest)}</span>` : s.rest === 0 ? `<span class="pill">${t("soldOut")}</span>` : `<b>${qty(s.rest)}</b>`}</td>
        <td class="r num" data-l="${t("cCarton")}">${s.cartonTxt ? `<span dir="ltr">${s.cartonTxt}</span>` : "—"}</td>
        <td class="r num" data-l="${t("cValue")}">${money(s.value)}</td></tr>`).join("") || `<tr><td colspan="9" class="empty">${t("noRef")}</td></tr>`}
      </tbody></table></div>`;

  const sq = $("#sq");
  sq.addEventListener("input", () => { state.stockQ = sq.value; const p = sq.selectionStart; renderStock(); const n = $("#sq"); n.focus(); n.setSelectionRange(p, p); });
  document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { state.stockFilter = b.dataset.f; renderStock(); }));
  document.querySelectorAll("[data-sort]").forEach(th => {
    const go = () => { const k = th.dataset.sort; state.sort = { key: k, dir: state.sort.key === k && state.sort.dir === "asc" ? "desc" : "asc" }; renderStock(); };
    th.addEventListener("click", go); th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

/* ---------------- Password-protected page ---------------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptRaw(enc, password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.data));
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(text);
}
function unlock(done){
  const KEY = "stock-pw:" + location.pathname;
  const box = document.createElement("section");
  box.className = "lock";
  box.innerHTML = `<form class="lock-card" autocomplete="on">
      <span class="vh-mark">${ic("store")}</span>
      <h1>${esc(consultName())}</h1>
      <p data-t="lockText"></p>
      <input type="password" id="lockPw" autocomplete="current-password" required>
      <button class="btn" type="submit" data-t="lockGo"></button>
      <div class="lock-err" id="lockErr" role="alert"></div>
      <button class="lock-lang" type="button" data-lang-btn></button>
    </form>`;
  document.body.prepend(box);
  applyLang();
  const tryPw = async (pw, silent) => {
    const btn = box.querySelector(".btn"); btn.disabled = true;
    try {
      EMBED.raw = await decryptRaw(EMBED.enc, pw);
      try { localStorage.setItem(KEY, pw); } catch(e){}
      box.remove(); done(); return true;
    } catch(e){
      if (!silent){ $("#lockErr").textContent = t("lockBad"); $("#lockPw").select(); }
      btn.disabled = false; return false;
    }
  };
  box.querySelector("form").addEventListener("submit", e => { e.preventDefault(); tryPw($("#lockPw").value); });
  let saved = ""; try { saved = localStorage.getItem(KEY) || ""; } catch(e){}
  if (saved) tryPw(saved, true).then(ok => { if (!ok) try { localStorage.removeItem(KEY); } catch(e){} });
  else $("#lockPw").focus();
}

/* ---------------- Boot ---------------- */
function boot(){
  if (VIEWER) document.documentElement.classList.add("viewer");
  document.body.insertAdjacentHTML("afterbegin", shellHtml());
  const extra = document.createElement("style");
  extra.textContent = "@media (max-width:760px){.back-mobile{display:inline-flex!important}}";
  document.head.appendChild(extra);
  applyLang();
  document.querySelectorAll(".tab[data-view]").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
  document.addEventListener("click", e => {
    if (e.target.closest(".back-mobile")){ state.step = 1; renderClients(); }
    if (e.target.closest("[data-pdf]")) downloadInvoicePdf();
  });
  if (VIEWER){
    const go = () => { start(EMBED.raw, EMBED.source, EMBED.date); setTimeout(() => toast(t("dataToast", prettyDate(EMBED.date))), 300); };
    if (EMBED.enc) unlock(go); else go();
    return;
  }
  ADMIN && ADMIN.boot();
}
boot();
})();
